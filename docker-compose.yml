# Local development — run all modules simultaneously.
# Usage: docker compose up --build
# Or without Docker: see comments below each service.

services:
  collection:
    build: .
    ports:
      - "8501:8501"
    environment:
      - FOLDER=modules/ai4se6d_collection
      - STX_URL_GENAI_INTRO=http://localhost:8502
    # Without Docker:
    #   cd modules/ai4se6d_collection && uv run streamlit run book.py --server.port 8501

  genai-intro:
    build: .
    ports:
      - "8502:8501"
    environment:
      - FOLDER=modules/ai4se6d_genai_intro
    # Without Docker:
    #   cd modules/ai4se6d_genai_intro && uv run streamlit run book.py --server.port 8502

  vibecoding:
    build: .
    ports:
      - "8503:8501"
    environment:
      - FOLDER=modules/ai4se6d_vibecoding
    # Without Docker:
    #   cd modules/ai4se6d_vibecoding && uv run streamlit run book.py --server.port 8503

  setup:
    build: .
    ports:
      - "8504:8501"
    environment:
      - FOLDER=modules/ai4se6d_setup
    # Without Docker:
    #   cd modules/ai4se6d_setup && uv run streamlit run book.py --server.port 8504

  day2:
    build: .
    ports:
      - "8505:8501"
    environment:
      - FOLDER=modules/ai4se6d_day2
    # Without Docker:
    #   cd modules/ai4se6d_day2 && uv run streamlit run book.py --server.port 8505
